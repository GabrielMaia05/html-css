<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplos de formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on"> 
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isxm" value="M"> <label for="isxm"> Masculino</label><br>
            <input type="radio" name="sexo" id="isxf" value="F"><label for="isxf"> Feminino</label><br>
        </fieldset>

        <fieldset>
            <legend>Esporte</legend>
            <input type="checkbox" name="basque" id="ibasque"><label for="ibasque"> Basquete</label><br>
            <input type="checkbox" name="fute" id="ifute"> <label for="ifute"> Futebol</label><br>
            <input type="checkbox" name="ten" id="iten"><label for="iten"> Tenis</label>
        </fieldset><br>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
    
</body>
</html>
