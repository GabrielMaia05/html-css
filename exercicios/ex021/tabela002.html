<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 400px;
        }

        caption{
           font-size: 1.5em;
           font-weight: bold;
           padding: 10px;
           background-color: lightgray;
        }

        thead{
            background-color: rgb(168, 168, 168);
            color: black;
        }

        tbody > tr:nth-child(even) /* 2n */ {
            background-color: lightgray;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
        }

        td.numero {
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>Uso de Tabelas Grandes</h1>
    <!-- 
    Anatomia para tabelas grandes
    Table
        THead
            tr, td, th
        TBody
            tr, td, th
        TFoot
            tr, td, th
 -->
    <table>
        <caption>População das Unidades Federais</caption>
        <thead>
            <tr>
                <th scope="col">Estado</th>
                <th scope="col" style="width: 50px;">População</th>
            </tr>
        </thead>
        
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="numero">45.973.194</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="numero">21.322.691</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td class="numero">17.219.679</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
